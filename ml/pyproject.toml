[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "svm-phenotype"
version = "0.1.0"
description = "IoT Multi-Sensor Phenotype Classification using Support Vector Machine"
authors = [{ name = "Renaldi Simamora" }]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "joblib>=1.3.0",
    "scipy>=1.10.0"
]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = [".", "src", ".venv/Lib/site-packages"]
